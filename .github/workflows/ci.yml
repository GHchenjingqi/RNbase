name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# 取消同一分支上已在进行中的旧运行，节省资源。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck / Lint / Format / Test
    runs-on: ubuntu-latest
    # 基座约束 node >= 22.11（见 package.json engines）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure version.json exists (fallback for CI)
        # 注意：heredoc 内容与结束符 EOF 必须顶格（写在 run 块的基准缩进上），
        # 多缩进会导致 bash 找不到结束符报 "here-document delimited by end-of-file"。
        run: |
          if [ ! -f version.json ]; then
            cat > version.json <<'EOF'
          {
            "appName": "RNBase",
            "apkName": "RNBase",
            "applicationId": "com.qux.base",
            "versionName": "1.0.0",
            "versionCode": 1,
            "remoteUrl": ""
          }
          EOF
            echo "Created fallback version.json for CI"
          fi

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # 测试代码也纳入类型检查：tsconfig.json 长期 exclude __tests__，改 Bridge 契约时
      # 测试里的类型失配只有跑到运行时才暴露（本次第一次跑就抓出 22 处）。
      - name: Typecheck tests (tsconfig.test.json)
        run: npm run typecheck:test

      - name: Lint (eslint)
        run: npm run lint

      # 带 --coverage 才有门禁：jest.config.js 的 coverageThreshold 只在收集覆盖率时生效。
      - name: Unit tests (jest + coverage gate)
        run: npm run test:coverage

      # Bridge 能力清单漂移守卫：api.js 注册表变更必须同步重新生成文档。
      - name: Bridge API doc drift check
        run: npm run gen:api-doc:check

      # 基座品牌中性守卫：checkout 出来的仓库可见路径（桌面名/闪屏底色/图标/鸿蒙桌面名）
      # 必须等于中性默认值，防止某个子应用的品牌跟着功能提交进基座历史。
      - name: Base brand neutrality check
        run: npm run brand:check

      # iOS 工程引用守卫：pbxproj 没引用的源文件不会让 xcodebuild 报错，
      # 只会打出一个「少了整块 Bridge 能力」的绿包，所以在 linux runner 上先查一遍。
      - name: iOS project reference check
        run: npm run ios:check-project

      # 说明：prettier 格式校验不在 CI 硬门禁内。仓库存在预存在的格式偏差
      # （缺 .prettierrc 导致长期以默认 80 列检查），格式统一由提交钩子
      # （.husky/pre-commit）对暂存文件自动修复向前约束；待全量
      # `npm run format` 对齐后可再加回 format:check。
