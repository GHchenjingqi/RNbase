name: iOS Build (Debug, Simulator)

# 独立 workflow：不阻塞主 CI（ci.yml）。仅在手动触发或 iOS 相关路径变更时跑，
# 用于在 macOS runner 上验证 iOS 原生工程 + 自研 Base* 模块能否编译通过。
# 注意：pod install 耗时较长，且需要 macOS 环境；release 出 .ipa 仍需 Xcode 手动 Archive。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'platforms/ios/**'
      - 'src/**'
      - 'scripts/ios.js'
      - 'scripts/ios-sync-h5.mjs'
      - 'package.json'
      - 'Podfile'
  pull_request:
    paths:
      - 'platforms/ios/**'
      - 'src/**'
      - 'scripts/ios.js'
      - 'scripts/ios-sync-h5.mjs'
      - 'package.json'
      - 'Podfile'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Sync H5 into iOS bundle
        run: npm run ios:sync-h5

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Pod install
        working-directory: platforms/ios
        run: pod install --repo-update

      - name: Xcode build (simulator, Debug)
        working-directory: platforms/ios
        # tee 到文件是为了下一步能把 error 行提成 annotation：xcodebuild 的报错只进日志正文，
        # 而日志正文要鉴权才能读（Actions 的 annotations 是公开 API 可读的）。
        # 没有这一步时，远端只知道「exit 65」，改 iOS 原生只能靠猜。
        run: |
          set -o pipefail
          xcodebuild -workspace qux.xcworkspace -scheme qux -configuration Debug \
            -sdk iphonesimulator build 2>&1 | tee /tmp/xcodebuild.log

      - name: Publish build errors as annotations
        if: failure()
        run: |
          if [ ! -f /tmp/xcodebuild.log ]; then
            echo '::error::xcodebuild 未产生日志（失败发生在构建之前）'
            exit 0
          fi
          hits=$(grep -E "error:" /tmp/xcodebuild.log | sort -u | head -40)
          if [ -z "$hits" ]; then
            echo '::error::xcodebuild 失败但日志里没有 error: 行，请查原始日志'
            exit 0
          fi
          printf '%s\n' "$hits" | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
