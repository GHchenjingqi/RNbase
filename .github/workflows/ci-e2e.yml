# P2-4：Maestro e2e（非阻塞，manual 触发）。
#
# 说明：
#  - e2e 依赖模拟器 + Maestro CLI，成本高于单测，故独立 workflow 且不设分支推送触发，
#    不阻塞主 CI（ci.yml）；需要时手动 Run workflow。
#  - 跑通前提：android assembleDebug 产出 apk（CI 内构建），Maestro 官方 action 驱动模拟器。
name: e2e (maestro, non-blocking)

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true # 非阻塞：e2e 失败仅标记，不卡合流
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: npm run build:android

      - name: Run Maestro flow
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: android/app/build/outputs/apk/debug/app-debug.apk
          maestro-files: maestro/flows
